<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px; background: var(--surface-page); display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { border-radius: var(--radius-md); border: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: center; padding: 14px; }
  img { height: 44px; width: auto; }
</style>
</head>
<body>
<div class="tile"><img src="../assets/logos/theqc-logo-en.png" alt="THEQC logo (EN, colour)" /></div>
<div class="tile"><img src="../assets/logos/yokak-logo-tr.png" alt="YÖKAK logo (TR, colour)" /></div>
<div class="tile" style="background: var(--yokak-blue-800); border: none;"><img src="../assets/logos/theqc-logo-en-white.png" alt="THEQC logo (EN, white)" /></div>
<div class="tile" style="background: var(--surface-subtle);"><img src="../assets/logos/yokak-logo-tr-black.png" alt="YÖKAK logo (TR, black)" /></div>
</body>
</html>
