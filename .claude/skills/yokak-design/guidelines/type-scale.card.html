<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px 24px; background: var(--surface-page); font-family: var(--font-primary); color: var(--text-strong); }
  .row { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--border-subtle); padding: 4px 0; }
  .t { font-family: var(--font-secondary); font-size: 10px; color: var(--text-faint); width: 90px; flex: none; }
  .s { font-weight: var(--fw-bold); letter-spacing: var(--ls-tight); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="row"><span class="t">display · 56</span><span class="s" style="font-size: var(--fs-display);">Aa Quality</span></div>
<div class="row"><span class="t">h1 · 40</span><span class="s" style="font-size: var(--fs-h1);">Aa Accreditation</span></div>
<div class="row"><span class="t">h2 · 32</span><span class="s" style="font-size: var(--fs-h2);">Aa Evaluation</span></div>
<div class="row"><span class="t">h3 · 24</span><span class="s" style="font-size: var(--fs-h3);">Aa Institutional</span></div>
<div class="row" style="border: none;"><span class="t">body · 16</span><span style="font-size: var(--fs-body);">Aa External quality assurance</span></div>
</body>
</html>
