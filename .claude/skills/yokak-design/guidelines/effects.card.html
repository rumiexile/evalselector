<!-- @dsCard group="Spacing" viewport="700x190" name="Radii, borders & shadows" subtitle="Restrained corners, cool soft shadows" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface-subtle); font-family: var(--font-secondary); display: flex; gap: 16px; align-items: center; }
  .box { width: 110px; height: 110px; background: var(--surface-card); border: 1px solid var(--border-subtle); display: flex; align-items: flex-end; padding: 8px; font-size: 10px; color: var(--text-faint); }
</style>
</head>
<body>
<div class="box" style="border-radius: var(--radius-sm);">sm · 3</div>
<div class="box" style="border-radius: var(--radius-md);">md · 6</div>
<div class="box" style="border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">lg · 10 + shadow-sm</div>
<div class="box" style="border-radius: var(--radius-lg); box-shadow: var(--shadow-md); border: none;">shadow-md</div>
<div class="box" style="border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); border: none;">shadow-lg</div>
</body>
</html>
