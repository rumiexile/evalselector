<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>YÖKAK — Website UI Kit</title>
<link rel="stylesheet" href="../../styles.css" />
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--surface-page); }
  a { color: var(--text-link); }
  a:hover { color: var(--text-link-hover); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="SiteHeader.jsx"></script>
<script type="text/babel" src="HomeSections.jsx"></script>
<script type="text/babel" src="SiteFooter.jsx"></script>
<script type="text/babel">
  function HomePage() {
    return (
      <div data-screen-label="Home">
        <window.SiteHeader active="Home" />
        <window.Hero />
        <window.News />
        <window.Documents />
        <window.SiteFooter />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<HomePage />);
</script>
</body>
</html>
